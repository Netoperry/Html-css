<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexible box</title>
    <style>
        div.container {
            background-color: lightsalmon;
            
            display: flex;
            flex-flow: row wrap;
            align-content: stretch;
            height: 400px;

        }
        
        div.iten {
            background-color: lightblue;
            border: 1px solid black;
            text-align: center;
            padding:40px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="iten">A</div>
        <div class="iten">B</div>
        <div class="iten">C</div>
        <div class="iten">D</div>
        <div class="iten">E</div>
        <div class="iten">F</div>
        <div class="iten">G</div>
        <div class="iten">H</div>
        <div class="iten">I</div>
        <div class="iten">J</div>
        <div class="iten">L</div>
        <div class="iten">M</div>

    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabelas</title>
    <style>
        Body {
            font-family: Arial, Helvetica, sans-serif1;
        }

        table {
            border-collapse: collapse;
        } 
        caption {
            font-size: 1.3em;
            font-weight: bold;
            padding: 10px;
        }

        th,td {
            border: 1px solid grey;
            padding: 5px;
        }

    </style>
</head>

<body>
     <table>
       
        <thead>
            <tr>
                <th rowspan="2" >Área</th>
                <th rowspan="2">Diciplinas</th>
                <th colspan="2" rowspan="2">notas</th>
                <th>Média</th>
            </tr>

        </thead>
        <tfoot>
            <tr>
                <th colspan="4" scope="row">total</th>
                <td>1000</td>
            </tr>       
        </tfoot>
        <tbody>
            <tr>
                <th rowspan="3" scope="rowgroup">exatas</th>
                <td>Ana Maria Santos</td>
                <td>alien</td>
                <td>Rambo</td>
                <td>Vingadores</td>
            </tr>
            <tr>
                <td>Beatriz souza</td>
                <td>Hulk</td>
                <td>inseption</td>
                <td>Batman</td>
            </tr>
            <tr>
                <td>Claudia Melo</td>
                <td>Oblivion</td>
                <td>Matrix</td>
                <td>big hero</td>
            </tr>
            <tr>
                <th rowspan="3" scope="rowgroup">Homens</th>
                <td>Bruno mendonça</td>
                <td>Intocaveis</td>
                <td>Amnesia</td>
                <td>Gladiador</td>
            </tr>
            <tr>
                <td>Daniel Lourenço</td>
                <td>wall-e</td>
                <td>Oldboy</td>
                <td>Dangal</td>
            </tr>
            <tr>
                <td>Fabiano Mota</td>
                <td>Star wars</td>
                <td>Taxi drive</td>
                <td>Toy story</td>
            </tr>
        </tbody>
        </tbody>
    </table>
</body>

</html>
